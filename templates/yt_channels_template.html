<!DOCTYPE html>
<html>
<head>
<title>YT Feeds - Channels</title>
<meta charset="utf-8">
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>YT Feeds - Channels</h1>
<div class="filters">
    <a href="/?status=all">Все</a> |
    <a href="/?status=new">New</a> |
    <a href="/?status=not_interested">Не смотреть</a> |
    <a href="/?status=viewed">Посмотрел</a> |
    <a href="/?status=todo">Отложить</a>
    <a href="/channels" class="active"><strong>Channels</strong></a>
</div>
<div class="channels-layout">
    <div class="sidebar">
        <h2>Channels</h2>
        {% for ch in channels %}
        <div class="channel-item" id="channel-{{ ch.id }}">
            <a href="/channels/{{ ch.id }}"
               class="channel-link {{ 'active' if active_channel_id == ch.id else '' }}"
               id="channel-link-{{ ch.id }}"
               hx-get="/api/channel/{{ ch.id }}/videos"
               hx-target="#channel-videos"
               hx-swap="innerHTML"
               hx-push-url="/channels/{{ ch.id }}"
               hx-indicator="#loading">
                {{ ch.title }}
            </a>
            <button class="btn-mark-viewed"
                hx-post="/api/channel/{{ ch.id }}/mark-viewed"
                hx-confirm="Пометить все новые видео канала «{{ ch.title }}» как прочитанные?"
                hx-swap="none">
                ✓
            </button>
            <button class="btn-delete-channel"
                hx-delete="/api/channel/{{ ch.id }}"
                hx-confirm="Удалить канал «{{ ch.title }}» и все его видео?"
                hx-target="#channel-{{ ch.id }}"
                hx-swap="outerHTML swap:0.3s">
                ×
            </button>
        </div>
        {% endfor %}
    </div>
    <div class="content" id="channel-videos">
        <span id="loading" style="color:#999;">Select a channel on the left</span>
    </div>
</div>
{% if active_channel_id %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var link = document.getElementById('channel-link-{{ active_channel_id }}');
        if (link) {
            link.click();
        }
    });
</script>
{% endif %}
</body>
</html>
