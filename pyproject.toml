[project]
name = "keromon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.10.0",
    "lxml>=6.0.0",
    "requests==2.27.1",
    "six>=1.17.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pytest>=9.0.3",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
